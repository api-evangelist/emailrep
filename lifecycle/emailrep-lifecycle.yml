      "An API key is not required to use the EmailRep API, but using one will afford you higher
      rate limits than the unauthenticated API." — docs last updated 2025-11-11.
    note: >-
      This is exactly the kind of change a deprecation policy exists to announce. A caller who
      built against the documented anonymous tier gets a 429 with no Sunset header, no changelog
      entry, and no dated notice.
